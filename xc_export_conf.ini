[MAIN]
src=world/2026
date=2026-07-29
country=KZ
log_level=DEBUG
lng=en
track_dir=D:\Trash\##993 XC\tracks
date_name=T1
igc_file_name=[XLSX-Name].[YYYY][MM][DD]-[H24][MI][SEC].[TYPE].[XLSX-Number].igc
#igc_file_name=[YYYY][MM][DD]-[H24][MI][SEC].[XC_NAME].[LOGIN].igc
#attendence_list_file =d:\Trash\#863 XC Export\Attendence list test.xlsx
#attendence_list_file =D:\Personal\Wind3style\workspace\xc_export\Attendence list.xlsx
# Alternative participant source: an FSDB file (FScomp). If set, it is used instead of
# attendence_list_file. The xcontest login is read from a per-participant custom field.
# fsdb_update=true adds that field (empty) to participants that don't have it, then you
# fill the logins in FScomp and run again.
fsdb=Participants_Open_Championship_of_the_Republic_of_Kazakhstan_v3.fsdb
#fsdb_update=false
#xcontest_login_field_name=xcontest login
only_check=no
#log_file=xc_export.log
#tg_bot_dir=/home/xc_scorer/tracks/kz
# tg_bot_mode: local (default) reads tg_bot_dir from local FS;
# ssh reads it from a remote server over SFTP (tg_bot_dir = path on the server).
#tg_bot_mode=ssh
xc_max_flights=100

# Each [ACCOUNT:*] is one xcontest session. cookie_file points to a text file with the
# "cookie" request header copied from a logged-in browser (DevTools -> Network -> any
# www.xcontest.org request -> header "cookie"). On HTTP 429/450/403 the script rotates
# to the next account.
[ACCOUNT:1]
cookie_file=xc_cookie_1.txt

[ACCOUNT:2]
cookie_file=xc_cookie_2.txt

# Used only when tg_bot_mode=ssh (reads tg_bot_dir from this server over SFTP).
#[SSH]
#host=82.118.235.134
#port=22
#username=xc_scorer
#password=xc_scorer_password

